# The public demo on GitHub Pages: the site in design/landing-1 (the overview and the three runs
# recorded live on Token Factory, with the "Your turn" breakdowns), plain files with no build and
# no backend, served at https://nkm1020.github.io/moonwright/. Check it locally: docs/deploy.md.
name: Pages

on:
  workflow_dispatch:
  # Once the repo is public, add the push trigger so every merge to main redeploys the demo:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer run waits for the one in progress (a deploy is never cut
# off half way) and replaces any run still queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the site is the artifact as it is: index.html, run.html, break.js, site.css, assets/, data/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: design/landing-1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
