<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moonwright · cold open</title>
<link rel="stylesheet" href="/__video/fonts.css">
<link rel="stylesheet" href="slides.css">
<style>
  /* The video's first seconds: the Isaac Sim mission at the moment it breaks (the site's own clip,
     design/landing-1/assets via slides/site), then the replan, before the title. */
  video { position: absolute; inset: 0; width: 1536px; height: 864px; object-fit: cover; background: #000; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgb(17 17 17 / 0.55), rgb(17 17 17 / 0) 28%, rgb(17 17 17 / 0) 70%, rgb(17 17 17 / 0.55)); }
  .head { position: absolute; left: 64px; top: 56px; }
  .feed { position: absolute; left: 64px; bottom: 120px; display: grid; gap: 12px; }
  .card { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-radius: 4px; background: rgb(17 17 17 / 0.86);
    border: 1px solid var(--line); opacity: 0; transform: translateY(8px); transition: opacity .45s ease, transform .55s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .card.in { opacity: 1; transform: none; }
  .card b { font: 400 40px/1 var(--display); text-transform: uppercase; }
  .card span { font: 500 22px/1.2 var(--sans); }
  .card.fail b { color: var(--fail); }
  .card.ok b { color: var(--accent-strong); }
</style>
</head>
<body>
<div class="stage">
  <video id="clip" src="site/isaac-closed-loop.webm" muted playsinline preload="auto"></video>
  <div class="shade"></div>
  <div class="head"><div class="eyebrow rise"><span class="rule"></span>NVIDIA Isaac Sim · Shackleton's rim · hour {{isaac_fail_h}}</div></div>
  <div class="feed">
    <div class="card fail" id="c-fail"><b>{{isaac_fail_robot}} breaks down</b><span>{{isaac_fail_progress}} through its first dig</span></div>
    <div class="card ok" id="c-replan"><b>{{isaac_replan_s}} s</b><span>CP-SAT replans the other {{isaac_replan_tasks}} tasks, and proves the new plan</span></div>
  </div>
</div>
<script>
  // the clip opens 1.4 s before the fault (EX1 turns red 5.75 s into it, hour 10)
  const START = 4.35, FAULT = 5.75;
  const clip = document.getElementById("clip");
  const card = (id) => document.getElementById(id).classList.add("in");
  clip.addEventListener("loadedmetadata", () => { clip.currentTime = START; });
  function tick() {
    if (clip.currentTime >= FAULT) card("c-fail");
    if (clip.currentTime >= FAULT + 1.3) card("c-replan");
    requestAnimationFrame(tick);
  }
  const start = () => { clip.currentTime = Math.max(clip.currentTime, START); clip.play(); requestAnimationFrame(tick); };
  const html = document.documentElement;
  if (html.classList.contains("play")) start();
  else new MutationObserver((_, ob) => { if (html.classList.contains("play")) { ob.disconnect(); start(); } })
    .observe(html, { attributes: true, attributeFilter: ["class"] });
</script>
<script src="preview.js"></script>
</body>
</html>
